# Generate AI Coding Tools Documentation RSS feeds
# Documentation typically updates less frequently than news feeds
# Default: weekly on Monday 00:00 UTC

name: Generate Docs Feeds

on:
  schedule:
    # Every Monday at 00:00 UTC (weekly)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full refresh (ignore cache)'
        required: false
        default: 'false'
        type: boolean
      max_articles:
        description: 'Max articles per feed'
        required: false
        default: '300'
        type: string

env:
  MAX_ARTICLES: ${{ vars.DOCS_MAX_ARTICLES || '300' }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI coding docs generators
        env:
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || env.MAX_ARTICLES }}
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            python scripts/run_ai_coding_docs.py --max $MAX_ARTICLES --full
          else
            python scripts/run_ai_coding_docs.py --max $MAX_ARTICLES
          fi

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add feeds/feed_*_docs.xml
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update AI coding docs RSS feeds [skip ci]"
            git push
          fi
